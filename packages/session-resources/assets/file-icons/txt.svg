  <path fill="#646A73" d="M64.5,87H2.5C1.2,87,0.2,86,0.2,84.7V60.6h66.6v24.1C66.8,86,65.8,87,64.5,87z"/>
  <text x="33.5" y="79" text-anchor="middle" fill="#FFFFFF" font-family="Arial Black, Impact, 'Helvetica Neue', sans-serif" font-size="15" font-weight="900" letter-spacing="1">TXT</text>
