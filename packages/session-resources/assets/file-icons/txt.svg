<?xml version="1.0" encoding="utf-8"?>
<!-- 纯文本文件图标。灰色 #646A73 与 FILE_TYPE_FAMILIES 里 text 族原本的
     线性图标色一致，从"灰色线框"升级为"米色纸底 + 灰底彩条"，风格与其他
     Office 类图标统一，但配色比 md/html 弱一档，暗示"通用文本"这层语义。
     中间三条横线代表若干行文本，比大写 T 直觉。 -->
